<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta name="description" content="Your saved OM Mobile Art skins wishlist."/>
  <title>Wishlist | OM Mobile Art</title>
  <link rel="icon" type="image/png" href="../../assets/logos/logo.png?v=2.0"/>
  <link rel="apple-touch-icon" href="../../assets/logos/logo.png?v=2.0"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script src="../../shared/js/tailwind-config-shop.js"></script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }
  </style>
  <link rel="stylesheet" href="../../shared/css/shop-scrollbar.css?v=1.1"/>
</head>
<body class="bg-background text-on-surface font-body-main selection:bg-primary-fixed selection:text-on-primary-fixed">

  <!-- Header Component -->
  <header></header>

  <main class="store-container py-10 min-h-screen">
    
    <!-- Wishlist Header -->
    <div class="mb-8 border-b border-gray-200 pb-4 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-extrabold text-[#111827]">Your Wishlist</h1>
        <p class="text-xs font-semibold text-gray-500 mt-1">Saved items on this device</p>
      </div>
    </div>

    <!-- Wishlist Products Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="wishlist-products-grid">
      <!-- Loaded dynamically via wishlist.js -->
    </div>

  </main>

  <!-- Footer Component -->
  <footer></footer>

  <!-- DB and Main scripts -->
  <script src="../../shared/js/storage.js?v=1.0.4"></script>
  <script src="../../shared/js/api.js?v=1.0.4"></script>
  <script src="../../shared/js/utils.js?v=1.0.4"></script>
  <script src="../../shared/js/notifications.js?v=1.0.4"></script>
  <script src="../../shared/components/navbar.js?v=1.0.4"></script>
  <script src="../../shared/components/productCard.js?v=1.0.4"></script>
  <script src="../../shared/components/loader.js?v=1.0.4"></script>
  
  <!-- Page script -->
  <script src="../../shop/js/wishlist.js?v=1.0.4"></script>
</body>
</html>
