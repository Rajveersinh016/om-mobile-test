<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="Sign in to your OM Mobile Art account to track orders, manage addresses and view your wishlist."/>
    <title>Account Access | OM Mobile Art</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script src="../../shared/js/tailwind-config-shop.js"></script>
    <link rel="stylesheet" href="../../shared/css/shop-scrollbar.css?v=1.1"/>
</head>
<body class="bg-background font-body-main text-on-surface">
    <!-- Announcement Bar -->
    
    <!-- TopNavBar -->
    <header></header>

    <main class="store-container py-16 flex justify-center items-center min-h-[60vh]">
        <div class="w-full max-w-md bg-surface-container-lowest border border-border-subtle p-8 rounded-2xl shadow-xl space-y-6">
            <!-- Branding Section -->
            <div class="flex flex-col items-center text-center space-y-4 mb-6">
                <!-- Logo Container -->
                <div class="w-[100px] h-[100px] bg-white border border-gray-100 rounded-[24px] shadow-md flex items-center justify-center p-3">
                    <img src="../../assets/logos/logo.png" alt="OM Mobile Art Logo" class="w-full h-full object-contain" data-setting-src="logo" onerror="if(window.handleLogoError) window.handleLogoError(this)" />
                </div>
                <!-- Title -->
                <h2 class="text-[34px] font-bold text-[#03045e] tracking-tight leading-tight" data-setting="storeName">OM Mobile Art</h2>
                <!-- Subtitle -->
                <p class="text-[16px] font-medium text-[#64748b] leading-relaxed">
                    Premium Mobile Skins<br/>
                    Custom Device Wraps<br/>
                    Screen Protection
                </p>
            </div>

            <!-- Tabs Header for Authentication Method -->
            <div class="flex border-b border-border-subtle pb-2 justify-center gap-8" id="auth-tabs">
                <button class="font-headline-h3 text-sm font-bold pb-2 border-b-2 border-primary text-primary transition-all flex items-center gap-1.5" id="tab-login-password">
                    <span class="material-symbols-outlined text-base">lock</span> Login with Password
                </button>
                <button class="font-headline-h3 text-sm font-bold pb-2 border-b-2 border-transparent text-text-muted hover:text-on-surface transition-all flex items-center gap-1.5" id="tab-register">
                    <span class="material-symbols-outlined text-base">person_add</span> Register
                </button>
            </div>

            <!-- 1. Password Login Form -->
            <form id="form-login" class="space-y-4">
                <div class="space-y-1">
                    <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block">Email Address</label>
                    <input type="email" id="login-email" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main" placeholder="john@gmail.com">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider">Password</label>
                        <a href="forgot_password.html" class="text-xs text-primary hover:underline font-medium" id="btn-forgot-password">Forgot Password?</a>
                    </div>
                    <input type="password" id="login-password" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full h-11 bg-primary text-on-primary font-button-text rounded-lg hover:bg-accent-hover active:scale-98 transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">login</span> Sign In with Password
                </button>
                <div class="text-center text-xs text-text-muted mt-2">
                    Try logging in with: <code class="bg-surface-container px-1 py-0.5 rounded text-on-surface">john@gmail.com</code> / <code class="bg-surface-container px-1 py-0.5 rounded text-on-surface">password123</code>
                </div>
            </form>

            <!-- Register Form -->
            <form id="form-register" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block">Full Name</label>
                    <input type="text" id="register-name" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main" placeholder="John Doe">
                </div>
                <div class="space-y-1">
                    <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block">Email Address</label>
                    <input type="email" id="register-email" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main" placeholder="john@gmail.com">
                </div>
                <div class="space-y-1">
                    <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block">Password</label>
                    <input type="password" id="register-password" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main" placeholder="••••••••">
                </div>
                <div class="space-y-1">
                    <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block">Confirm Password</label>
                    <input type="password" id="register-confirm" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full h-11 bg-primary text-on-primary font-button-text rounded-lg hover:bg-accent-hover active:scale-98 transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">person_add</span> Create Account
                </button>
            </form>

            <!-- Forgot Password View -->
            <form id="form-forgot" class="space-y-4 hidden">
                <h4 class="font-headline-h3 text-base text-center">Reset Your Password</h4>
                <p class="text-xs text-text-muted text-center leading-relaxed">Enter your email and we'll simulate sending a secure password reset link to your inbox.</p>
                <div class="space-y-1">
                    <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block">Email Address</label>
                    <input type="email" id="forgot-email" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main" placeholder="john@gmail.com">
                </div>
                <div class="flex gap-4">
                    <button type="button" class="w-1/2 h-11 border border-border-subtle rounded-lg font-button-text hover:bg-surface-container-low transition-colors" id="btn-forgot-back">Back to Login</button>
                    <button type="submit" class="w-1/2 h-11 bg-primary text-on-primary font-button-text rounded-lg hover:bg-accent-hover transition-colors">Send Link</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer></footer>

    <!-- Database and Main scripts -->
    <script src="../../shared/js/storage.js"></script>
    <script src="../../shared/js/settings-manager.js"></script>
    <script src="../../shared/js/utils.js" defer></script><script src="../../shared/js/notifications.js" defer></script><script src="../../shared/components/navbar.js" defer></script><script src="../../shared/components/productCard.js" defer></script><script src="../../shared/components/loader.js" defer></script>
    <script src="../../shared/components/otpComponent.js"></script>
    <!-- Authentication script -->
    <script src="../../shop/js/auth.js"></script>
</body>
</html>
