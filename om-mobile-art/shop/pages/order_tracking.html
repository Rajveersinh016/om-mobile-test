<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="Track your OM Mobile Art order in real time."/>
    <title>Track Order | OM Mobile Art</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-line {
            transition: width 0.8s ease-in-out;
        }
    </style>
    <script src="../../shared/js/tailwind-config-shop.js"></script>
    <link rel="stylesheet" href="../../shared/css/shop-scrollbar.css?v=1.1"/>
</head>
<body class="bg-background font-body-main text-on-surface">
    <!-- TopNavBar -->
    <header></header>

    <main class="store-container py-16 space-y-10 min-h-[60vh]">
        <!-- Search bar to search another order -->
        <div class="flex justify-between items-center flex-wrap gap-4 border-b border-border-subtle pb-6">
            <div>
                <h1 class="font-headline-h2 text-headline-h2 font-bold" id="tracking-title">Track Your Order</h1>
                <p class="text-text-muted text-sm" id="tracking-subtitle">Loading tracking details...</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="order-search-input" placeholder="e.g. OM-2608-0001" class="border border-border-subtle rounded-md h-10 px-3 text-sm focus:outline-none focus:border-primary">
                <button onclick="window.searchOrderTracking()" class="px-4 h-10 bg-primary text-on-primary rounded-md font-button-text hover:bg-accent-hover transition-colors font-bold text-sm">Track</button>
            </div>
        </div>

        <!-- Timeline Stepper & History Container -->
        <div class="bg-surface-container-lowest border border-border-subtle p-6 md:p-8 rounded-xl shadow-sm space-y-8">
            <!-- Dynamic Stepper Bar Mount -->
            <div id="timeline-stepper-mount" class="space-y-6">
                <div class="py-8 text-center text-text-muted text-sm flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined animate-spin text-primary">sync</span> Loading order timeline...
                </div>
            </div>

            <!-- Detailed Status History Stream -->
            <div class="border-t border-border-subtle/80 pt-6 space-y-4">
                <h3 class="font-bold text-sm text-on-surface flex items-center gap-2 uppercase tracking-wider">
                    <span class="material-symbols-outlined text-primary text-[20px]">history</span> Order Status History Log
                </h3>
                <div id="timeline-history-mount" class="space-y-3">
                    <!-- History events dynamically rendered here -->
                </div>
            </div>

            <!-- Realtime Sync & Simulation Bar -->
            <div class="bg-surface-container-low p-4 rounded-lg flex flex-wrap justify-between items-center gap-4 text-sm border border-border-subtle/50">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[18px]">sync</span>
                    <span class="font-semibold text-on-surface text-xs">Realtime Auto-Sync:</span>
                    <p class="text-xs text-text-muted">Updates automatically when admin modifies order status in backoffice.</p>
                </div>
                <div class="flex gap-2">
                    <button id="btn-prev-status" class="px-3 py-1.5 border border-border-subtle rounded-md bg-white hover:bg-surface-container transition-colors font-button-text text-xs font-semibold">Prev Stage</button>
                    <button id="btn-next-status" class="px-3 py-1.5 bg-primary text-on-primary rounded-md hover:bg-accent-hover transition-colors font-button-text text-xs font-semibold">Next Stage</button>
                </div>
            </div>
        </div>

        <!-- Order Items & Shipping Address Layout -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Order summary -->
            <div class="bg-surface-container-lowest border border-border-subtle p-6 rounded-lg shadow-md space-y-4">
                <h3 class="font-headline-h3 text-base font-bold border-b border-border-subtle/50 pb-3 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">receipt</span> Items Ordered
                </h3>
                <div id="tracking-items-list" class="divide-y divide-border-subtle/50">
                    <!-- Items inject here -->
                </div>
            </div>

            <!-- Delivery Address -->
            <div class="bg-surface-container-lowest border border-border-subtle p-6 rounded-lg shadow-md space-y-4">
                <h3 class="font-headline-h3 text-base font-bold border-b border-border-subtle/50 pb-3 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">pin_drop</span> Shipping Address
                </h3>
                <div id="tracking-address" class="text-sm space-y-1.5 leading-relaxed text-text-secondary">
                    <!-- Address details inject here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer></footer>

    <!-- Database and Main scripts -->
    <script src="../../shared/js/storage.js"></script>
    <script src="../../shared/js/utils.js" defer></script>
    <script src="../../shared/js/notifications.js" defer></script>
    <script src="../../shared/components/navbar.js" defer></script>
    <script src="../../shared/components/productCard.js" defer></script>
    <script src="../../shared/components/loader.js" defer></script>
    <script src="../../shared/js/api.js"></script>
    <!-- Tracking timeline script -->
    <script src="../../shop/js/tracking.js"></script>
</body>
</html>
