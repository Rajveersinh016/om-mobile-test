<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account | OM Mobile Art</title>
<meta name="description" content="Create your OM Mobile Art account to track orders, save wishlist items and enjoy faster checkout."/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>
<script src="../../shared/js/tailwind-config-shop.js"></script>

  <link rel="stylesheet" href="../../shared/css/shop-scrollbar.css?v=1.1"/>
</head>
<body class="bg-background font-body-main text-on-surface">
<!-- Announcement Bar -->

<!-- TopNavBar -->
<header></header>

<main class="store-container py-16 flex justify-center items-center min-h-[60vh]">
  <div class="w-full max-w-md bg-surface-container-lowest border border-border-subtle p-8 rounded-lg shadow-xl space-y-6">
    <!-- Branding Section -->
    <div class="flex flex-col items-center text-center space-y-4 mb-6">
        <!-- Logo Container -->
        <div class="w-[100px] h-[100px] bg-white border border-gray-100 rounded-[24px] shadow-md flex items-center justify-center p-3">
            <img src="../../assets/logos/logo.png" alt="OM Mobile Art Logo" class="w-full h-full object-contain" data-setting-src="logo" onerror="if(window.handleLogoError) window.handleLogoError(this)" />
        </div>
        <!-- Title -->
        <h2 class="text-[34px] font-bold text-[#03045e] tracking-tight leading-tight" data-setting="storeName">OM Mobile Art</h2>
        <!-- Subtitle -->
        <p class="text-[16px] font-medium text-[#64748b] leading-relaxed">
            Premium Mobile Skins<br/>
            Custom Device Wraps<br/>
            Screen Protection
        </p>
    </div>

    <!-- Header -->
    <div class="text-center border-b border-border-subtle pb-4">
      <h1 class="font-headline-h2 text-xl font-bold">Create Your Account</h1>
      <p class="text-text-muted text-sm mt-1">Already have an account? <a href="login.html" class="text-primary hover:underline font-medium">Sign in</a></p>
    </div>

    <!-- Register Form -->
    <form id="form-register" class="space-y-4" novalidate>
      <div class="space-y-1">
        <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block" for="register-name">Full Name *</label>
        <input type="text" id="register-name" name="name" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main transition-colors" placeholder="John Doe">
      </div>
      <div class="space-y-1">
        <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block" for="register-email">Email Address *</label>
        <input type="email" id="register-email" name="email" required class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main transition-colors" placeholder="john@example.com">
      </div>
      <div class="space-y-1">
        <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block" for="register-phone">Phone Number</label>
        <input type="tel" id="register-phone" name="phone" class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main transition-colors" placeholder="+91 96386 52327">
      </div>
      <div class="space-y-1">
        <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block" for="register-password">Password * <span class="normal-case text-text-muted">(min 8 chars)</span></label>
        <div class="relative">
          <input type="password" id="register-password" name="password" required class="w-full h-11 px-4 pr-12 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main transition-colors" placeholder="••••••••">
          <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-text-muted hover:text-on-surface text-[20px]" data-target="register-password">visibility</button>
        </div>
      </div>
      <div class="space-y-1">
        <label class="font-label-caps text-xs text-on-surface-variant uppercase tracking-wider block" for="register-confirm">Confirm Password *</label>
        <div class="relative">
          <input type="password" id="register-confirm" name="confirm" required class="w-full h-11 px-4 pr-12 border border-border-subtle rounded-lg focus:outline-none focus:border-primary text-body-main transition-colors" placeholder="••••••••">
          <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-text-muted hover:text-on-surface text-[20px]" data-target="register-confirm">visibility</button>
        </div>
      </div>
      <div class="flex items-start gap-3 pt-1">
        <input type="checkbox" id="register-terms" required class="w-4 h-4 mt-0.5 accent-primary rounded border-border-subtle">
        <label for="register-terms" class="text-xs text-text-secondary leading-relaxed">I agree to the <a href="terms.html" class="text-primary hover:underline">Terms of Service</a> and <a href="privacy_policy.html" class="text-primary hover:underline">Privacy Policy</a></label>
      </div>
      <button id="register-submit-btn" type="submit" class="w-full h-11 bg-primary text-on-primary font-button-text rounded-lg hover:bg-accent-hover active:scale-95 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-sm">person_add</span> Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-4">
      <div class="flex-1 h-px bg-border-subtle"></div>
      <span class="text-xs text-text-muted font-label-caps">or continue with</span>
      <div class="flex-1 h-px bg-border-subtle"></div>
    </div>
    <button onclick="window.location.href='login.html'" class="w-full h-11 border border-border-subtle rounded-lg font-button-text text-sm hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-[18px]">mail</span> Sign in with existing account
    </button>
  </div>
</main>

<!-- Footer -->
<footer></footer>

<script src="../../shared/js/storage.js"></script>
<script src="../../shared/js/settings-manager.js"></script>
<script src="../../shared/js/utils.js"></script>
<script src="../../shared/js/notifications.js"></script>
<script src="../../shared/components/navbar.js" defer></script>
<script src="../../shop/js/register.js" defer></script>
</body>
</html>
