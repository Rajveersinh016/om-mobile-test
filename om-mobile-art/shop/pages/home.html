<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>OM Mobile Art | Premium Mobile Skins & Accessories</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../assets/logos/logo.png?v=2.0"/>
  <link rel="apple-touch-icon" href="../../assets/logos/logo.png?v=2.0"/>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <meta name="description"
    content="Shop premium ultra-thin 3M mobile skins for iPhone, Samsung, Google Pixel, and more. Precision-cut, bubble-free installation, and premium minimalist style." />

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }

    /* Premium Micro Interactions */
    .premium-card {
      transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 300ms cubic-bezier(0.16, 1, 0.3, 1), border-color 300ms ease;
    }

    .premium-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
    }

    .zoom-image {
      transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .zoom-image:hover {
      transform: scale(1.03);
    }

    .premium-btn {
      transition: transform 200ms ease, background-color 200ms ease, border-color 200ms ease, color 200ms ease;
    }

    .premium-btn:hover {
      transform: scale(1.02);
    }

    .premium-btn:active {
      transform: scale(0.98);
    }

    /* Category circle outlines */
    .category-circle-wrapper {
      transition: border-color 250ms ease, transform 250ms ease;
    }

    .category-circle-wrapper:hover {
      border-color: #03045E;
      /* Primary Blue border */
      transform: translateY(-2px);
    }

    /* Heart animation */
    .wishlist-heart {
      transition: color 200ms ease, transform 200ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .wishlist-heart:active {
      transform: scale(1.3);
    }

    .wishlist-heart.filled {
      font-variation-settings: 'FILL' 1;
      color: #03045E !important;
    }

    /* Horizontal scroll snap */
    .no-scrollbar::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    /* Skeleton Loading Animation */
    @keyframes skeleton-shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
    }

    /* Carousel Transition */
    .slide-fade {
      transition: opacity 500ms ease-in-out;
    }
  </style>

  <!-- Tailwind Configuration Injector -->
  <script src="../../shared/js/tailwind-config-shop.js"></script>
  <link rel="stylesheet" href="../../shared/css/shop-scrollbar.css?v=1.1" />
</head>

<body class="bg-background font-body-main text-on-surface">

        <!-- Hero Showcase Skeleton -->
        <div class="store-container grid grid-cols-1 lg:grid-cols-12 gap-8 items-center py-10">

            <div class="h-6 w-36 shimmer rounded-full"></div>
            <div class="h-12 w-3/4 shimmer rounded-xl"></div>
            <div class="h-12 w-2/3 shimmer rounded-xl"></div>
            <div class="h-16 w-full shimmer rounded-xl"></div>
            <div class="flex gap-4 pt-2">
              <div class="h-12 w-36 shimmer rounded-xl"></div>

            </div>
          </div>
          <div class="lg:col-span-6 flex justify-center">
            <div class="w-[260px] h-[480px] shimmer rounded-[36px]"></div>
          </div>
        </div>

        <!-- Category Row Skeleton -->
        <div class="store-container grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-6">
          <div class="flex flex-col items-center gap-3">
            <div class="w-24 h-24 rounded-full shimmer"></div>
            <div class="h-4 w-16 shimmer rounded"></div>
          </div>
          <div class="flex flex-col items-center gap-3">
            <div class="w-24 h-24 rounded-full shimmer"></div>
            <div class="h-4 w-16 shimmer rounded"></div>
          </div>
          <div class="flex flex-col items-center gap-3">
            <div class="w-24 h-24 rounded-full shimmer"></div>
            <div class="h-4 w-16 shimmer rounded"></div>
          </div>
          <div class="hidden sm:flex flex-col items-center gap-3">

            <div class="w-24 h-24 rounded-full shimmer"></div>
            <div class="h-4 w-16 shimmer rounded"></div>
          </div>
        </div>

        <!-- Cards Grid Skeleton -->
        <div class="store-container space-y-6">
          <div class="h-8 w-48 shimmer rounded"></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="aspect-square shimmer rounded-lg"></div>
            <div class="aspect-square shimmer rounded-lg"></div>
            <div class="aspect-square shimmer rounded-lg"></div>
            <div class="aspect-square shimmer rounded-lg"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer Section (Dynamically Loaded by navbar.js) -->

</body>

</html>
