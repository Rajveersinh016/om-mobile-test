<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1.0" name="viewport"/><title>Admin Login | OM Mobile Art</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>body{font-family:'DM Sans',sans-serif;}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style>
<script src="../../shared/js/tailwind-config-admin.js"></script>

  <link rel="stylesheet" href="../../shared/css/admin-scrollbar.css?v=1.1"/>
</head>
<body class="bg-[#F8FAFC] font-sans min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-sm mx-auto p-8 bg-white border border-[#E5E7EB] rounded-2xl shadow-xl space-y-6">
  <!-- Branding Section -->
  <div class="flex flex-col items-center text-center space-y-4 mb-6">
    <!-- Logo Container -->
    <div class="w-[100px] h-[100px] bg-white border border-gray-100 rounded-[24px] shadow-md flex items-center justify-center p-3">
      <img src="../../assets/logos/logo.png" alt="OM Mobile Art Logo" class="w-full h-full object-contain" />
    </div>
    <!-- Title -->
    <h2 class="text-[34px] font-bold text-[#03045e] tracking-tight leading-tight">OM Mobile Art</h2>
    <!-- Subtitle / Portal indicator -->
    <div class="space-y-1">
      <p class="text-xs font-bold text-[#6B7280] uppercase tracking-wider">Admin Portal</p>
      <p class="text-[16px] font-medium text-[#64748b] leading-relaxed">
        Secure Administration Dashboard
      </p>
    </div>
  </div>
  <form id="admin-login-form" class="space-y-4">
    <div>
      <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" for="admin-email">Email</label>
      <input type="email" id="admin-email" required class="w-full h-11 px-4 border border-gray-300 rounded-lg focus:outline-none focus:border-[#0077B6] text-sm" placeholder="admin@omma.com" value="admin@omma.com">
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" for="admin-password">Password</label>
      <input type="password" id="admin-password" required class="w-full h-11 px-4 border border-gray-300 rounded-lg focus:outline-none focus:border-[#0077B6] text-sm" placeholder="••••••••" value="admin123">
    </div>
    <button type="submit" class="w-full h-12 bg-[#0077B6] hover:bg-[#03045E] text-white font-bold rounded-[10px] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 shadow-md">
      <span class="material-symbols-outlined text-sm">lock</span> Sign In to Admin
    </button>
  </form>
  <p class="text-xs text-center text-gray-400">Use admin@omma.com / admin123</p>
  <div class="text-center"><a href="../../shop/pages/home.html" class="text-xs font-semibold text-[#0077B6] hover:underline">← Back to Store</a></div>
</div>
<script src="../../shared/js/storage.js"></script>
<script src="../../shared/js/notifications.js"></script>
<script>
document.getElementById('admin-login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  let email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;

  try {
    const res = await fetch('http://localhost:3000/api/v1/auth/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok && data.success && data.data && data.data.tokens) {
      const token = data.data.tokens.accessToken;
      localStorage.setItem('om_admin_auth_token', token);
      const user = data.data.user || {};
      localStorage.setItem('om_admin_session', JSON.stringify({
        id: user.id || '2aa093c3-6c26-493b-8e2b-b96fe175cd0d',
        email: user.email || email,
        name: user.name || 'Staff Administrator',
        role: user.role || 'ADMIN',
        isAdmin: true
      }));
      window.showToast('Welcome back, ' + (user.name || 'Admin') + '!', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      return;
    }
  } catch (err) {
    console.warn('Backend auth server not reachable, attempting fallback admin authentication...', err);
  }

  // Fallback authentication engine
  if (email.toLowerCase().includes('admin') || email === 'admin@omma.com' || email === 'admin@ommobileart.com') {
    const user = {
      id: '2aa093c3-6c26-493b-8e2b-b96fe175cd0d',
      email: email,
      name: 'Staff Administrator',
      role: 'ADMIN',
      isAdmin: true
    };
    localStorage.setItem('om_admin_session', JSON.stringify(user));
    localStorage.setItem('om_admin_auth_token', 'mock_admin_token_' + Date.now());
    window.showToast('Welcome back, Administrator!', 'success');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    return;
  }

  window.showToast('Invalid administrator credentials.', 'error');
});
</script>
</body></html>
