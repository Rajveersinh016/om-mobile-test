<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>Homepage Manager | OM Mobile Art Admin</title>
  <meta name="description" content="Configure storefront landing page sections dynamically."/>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <style>
    body { font-family: 'DM Sans', sans-serif; background-color: #F8FAFC; }
    .switch-checkbox:checked + .switch-label { background-color: #0077B6; }
    .switch-checkbox:checked + .switch-label .switch-dot { transform: translateX(100%); }
  </style>

  <script src="../../shared/js/tailwind-config-admin.js"></script>
  <link rel="stylesheet" href="../../shared/css/admin-scrollbar.css?v=1.1"/>
</head>
<body class="bg-[#F8FAFC] font-body-default text-[#111827] overflow-x-hidden">
  <!-- SideNavBar Placeholder -->
  <aside></aside>
  
  <!-- Main Content Shell -->
  <div class="ml-[240px] min-h-screen flex flex-col pb-16">
    <!-- TopNavBar Placeholder -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200 h-[64px] flex items-center justify-between px-8 shadow-sm"></header>
    
    <!-- Main Canvas -->
    <main class="pt-6 px-8 space-y-6">
      <!-- Top Action Row -->
      <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
        <div>
          <h2 class="text-2xl font-extrabold text-[#03045E] flex items-center gap-3">
            Homepage Layout Builder
          </h2>
          <p class="text-xs text-gray-500 mt-1 font-medium">Reorder storefront sections, edit announcements, hero banners, and promotional content.</p>
        </div>

        <button onclick="saveAllLayoutChanges()" class="px-5 py-2.5 bg-[#0077B6] hover:bg-[#03045E] text-white text-xs font-bold rounded-xl shadow-md transition-all flex items-center gap-2 cursor-pointer active:scale-95">
          <span class="material-symbols-outlined text-[18px]">save</span> Save Layout Order
        </button>
      </div>

      <!-- CMS Split Layout Container -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- LEFT COLUMN: Section List & Layout Reordering (5/12 width) -->
        <div class="lg:col-span-5 bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
          <div class="p-5 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
            <h3 class="font-extrabold text-xs text-[#03045E] uppercase tracking-wider">Storefront Sections</h3>
            <span class="text-xs font-bold text-[#0077B6] bg-[#CAF0F8] px-2.5 py-0.5 rounded-full" id="sections-count">13 Sections</span>
          </div>
          
          <div class="divide-y divide-gray-100" id="layout-sections-list">
            <div class="p-8 text-center text-gray-400">
              <div class="animate-spin w-8 h-8 border-4 border-[#0077B6] border-t-transparent rounded-full mx-auto mb-3"></div>
              Loading sections...
            </div>
          </div>
        </div>
        
        <!-- RIGHT COLUMN: Active Section Editor Form (7/12 width) -->
        <div class="lg:col-span-7 space-y-6">
          <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden min-h-[500px]" id="section-editor-panel">
            <div class="p-5 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
              <h3 class="font-extrabold text-xs text-[#03045E] uppercase tracking-wider" id="editor-heading">Section Configuration</h3>
            </div>
            
            <div class="p-6" id="editor-body">
              <div class="text-center py-16 text-gray-400">
                <span class="material-symbols-outlined text-4xl mb-2 text-gray-300">touch_app</span>
                <p class="text-xs font-bold text-gray-600">Select any section on the left to edit content and appearance settings.</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../../shared/js/storage.js"></script>
  <script src="../../shared/js/api.js"></script>
  <script src="../../admin/js/sidebar.js"></script>
  <script src="../../admin/js/header.js"></script>
  <script src="../../admin/js/uploader.js"></script>
  <script src="../../shared/js/utils.js" defer></script>
  <script src="../../admin/js/admin.js" defer></script>
  <script src="../../admin/js/homepage_manager.js" defer></script>
</body>
</html>
