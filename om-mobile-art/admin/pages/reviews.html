<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
    <title>Reviews Management | OM Admin</title>
    <meta name="description" content="Manage and moderate customer product reviews in OM Mobile Art admin panel."/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f8fafc; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    </style>
    <script src="../../shared/js/tailwind-config-admin.js"></script>
    <link rel="stylesheet" href="../../shared/css/admin-scrollbar.css?v=1.1"/>
</head>
<body class="bg-surface text-on-surface">
    <aside></aside>
    <div class="ml-[240px] min-h-screen flex flex-col">
        <header></header>
        <main class="flex-1 p-6 lg:p-8 space-y-8">

            <!-- Title Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-[#03045E] tracking-tight">Customer Reviews</h1>
                    <p class="text-xs text-gray-500 font-medium">Real-time review analytics and customer moderation</p>
                </div>
                <button type="button" onclick="loadAdminReviews()" class="px-4 py-2 bg-[#0077B6] hover:bg-[#03045E] text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center gap-1.5 self-start">
                    <span class="material-symbols-outlined text-base">refresh</span>
                    <span>Refresh</span>
                </button>
            </div>

            <!-- Dashboard Stats Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                <div class="bg-white border border-gray-200/80 p-5 rounded-2xl shadow-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-gray-400 uppercase tracking-wider">Total Reviews</span>
                        <div class="w-9 h-9 rounded-xl bg-blue-50 text-[#0077B6] flex items-center justify-center">
                            <span class="material-symbols-outlined text-xl">rate_review</span>
                        </div>
                    </div>
                    <p class="text-2xl font-black text-[#03045E]" id="stat-total-reviews">0</p>
                </div>

                <div class="bg-white border border-gray-200/80 p-5 rounded-2xl shadow-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-gray-400 uppercase tracking-wider">Average Rating</span>
                        <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                            <span class="material-symbols-outlined text-xl">star</span>
                        </div>
                    </div>
                    <div class="flex items-baseline gap-2">
                        <p class="text-2xl font-black text-[#03045E]" id="stat-avg-rating">0.0</p>
                        <span class="text-xs text-gray-400 font-bold">/ 5.0</span>
                    </div>
                </div>

                <div class="bg-white border border-gray-200/80 p-5 rounded-2xl shadow-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-gray-400 uppercase tracking-wider">Verified Buyers</span>
                        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                            <span class="material-symbols-outlined text-xl">verified</span>
                        </div>
                    </div>
                    <p class="text-2xl font-black text-emerald-700" id="stat-published-reviews">0</p>
                </div>

                <div class="bg-white border border-gray-200/80 p-5 rounded-2xl shadow-xs space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-gray-400 uppercase tracking-wider">5-Star Ratings</span>
                        <div class="w-9 h-9 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center">
                            <span class="material-symbols-outlined text-xl">hotel_class</span>
                        </div>
                    </div>
                    <p class="text-2xl font-black text-purple-800" id="stat-five-star-reviews">0</p>
                </div>
            </div>

            <!-- Filters & Controls Bar -->
            <div class="bg-white border border-gray-200/80 p-5 rounded-2xl shadow-xs space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Search Reviews</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-2.5 text-gray-400 text-lg">search</span>
                            <input type="text" id="filter-search" oninput="debounceSearch()" placeholder="Search user, email, product..." class="w-full pl-9 pr-4 h-10 border border-gray-300 rounded-xl text-xs text-gray-800 focus:ring-2 focus:ring-[#0077B6] outline-none"/>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Filter by Rating</label>
                        <select id="filter-rating" onchange="loadAdminReviews()" class="w-full h-10 px-3 border border-gray-300 rounded-xl text-xs font-bold text-gray-800 focus:ring-2 focus:ring-[#0077B6] outline-none">
                            <option value="">All Ratings (1 - 5 Stars)</option>
                            <option value="5">⭐⭐⭐⭐⭐ (5 Stars)</option>
                            <option value="4">⭐⭐⭐⭐ (4 Stars)</option>
                            <option value="3">⭐⭐⭐ (3 Stars)</option>
                            <option value="2">⭐⭐ (2 Stars)</option>
                            <option value="1">⭐ (1 Star)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Results Count</label>
                        <div class="h-10 px-4 bg-gray-50 border border-gray-200 rounded-xl flex items-center text-xs font-bold text-gray-700" id="reviews-count-display">
                            0 reviews listed
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reviews List Mount -->
            <div id="reviews-list-container" class="space-y-4">
                <div class="p-12 text-center text-gray-400">Loading reviews...</div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../../shared/js/storage.js"></script>
    <script src="../../shared/js/api.js"></script>
    <script src="../../shared/js/review-component.js"></script>
    <script src="../../admin/js/admin.js"></script>
    <script>
        let searchTimeout = null;

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadAdminReviews, 300);
        }

        async function loadAdminReviews() {
            const container = document.getElementById('reviews-list-container');
            const searchVal = document.getElementById('filter-search').value.trim();
            const ratingVal = document.getElementById('filter-rating').value;

            try {
                const token = localStorage.getItem('om_admin_auth_token') || (window.getAuthToken ? await window.getAuthToken() : null);
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

                let queryParams = new URLSearchParams();
                if (searchVal) queryParams.append('search', searchVal);
                if (ratingVal) queryParams.append('rating', ratingVal);

                const res = await fetch(`http://localhost:3000/api/v1/admin/reviews?${queryParams.toString()}`, { headers });
                let reviews = [];
                let stats = { totalReviews: 0, averageRating: 0 };

                if (res.ok) {
                    const data = await res.json();
                    reviews = data.data?.reviews || [];
                    stats = data.data?.stats || { totalReviews: 0, averageRating: 0 };
                } else {
                    // Fallback to storage
                    reviews = window.DB ? window.DB.getReviews() : [];
                    stats.totalReviews = reviews.length;
                    stats.averageRating = reviews.length > 0 ? (reviews.reduce((a, b) => a + (b.rating || 5), 0) / reviews.length) : 0;
                }

                // Update Stats
                document.getElementById('stat-total-reviews').textContent = stats.totalReviews;
                document.getElementById('stat-avg-rating').textContent = stats.averageRating > 0 ? stats.averageRating.toFixed(1) : '0.0';
                document.getElementById('stat-published-reviews').textContent = stats.totalReviews;
                document.getElementById('stat-five-star-reviews').textContent = reviews.filter(r => r.rating === 5).length;
                document.getElementById('reviews-count-display').textContent = `${reviews.length} reviews listed`;

                if (reviews.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white border border-dashed border-gray-300 rounded-3xl p-12 text-center max-w-md mx-auto space-y-3">
                            <span class="material-symbols-outlined text-4xl text-gray-400">rate_review</span>
                            <h4 class="font-bold text-base text-gray-900">No Reviews Found</h4>
                            <p class="text-xs text-gray-500">There are no reviews matching your search filters.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = reviews.map(r => {
                    const userName = r.user?.name || r.userName || 'Customer';
                    const userEmail = r.user?.email || r.userEmail || '';
                    const productName = r.product?.name || 'Product #' + r.productId;
                    const orderNum = r.order?.orderNumber || 'Delivered Purchase';
                    const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : (r.date || 'Recent');
                    const starsHTML = window.renderProductRatingHTML ? window.renderProductRatingHTML(r.rating, 1, { size: 'xs', showTextIfZero: false }) : '★ ' + r.rating;

                    return `
                        <div class="bg-white border border-gray-200/80 rounded-2xl p-6 shadow-xs hover:border-[#0077B6]/50 transition-all space-y-3">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-[#0077B6]/10 text-[#0077B6] font-extrabold flex items-center justify-center text-sm">
                                        ${userName.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <h4 class="font-extrabold text-sm text-gray-900">${userName} <span class="text-xs font-normal text-gray-400">(${userEmail})</span></h4>
                                        <p class="text-[11px] text-gray-400 font-medium">${dateStr} • Order #${orderNum}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="px-2.5 py-1 bg-emerald-50 border border-emerald-200 text-emerald-700 text-[10px] font-extrabold rounded-full flex items-center gap-1">
                                        <span class="material-symbols-outlined text-xs">verified</span>
                                        Verified Purchase
                                    </span>
                                    <button type="button" onclick="deleteAdminReview('${r.id}')" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-xl transition-colors flex items-center gap-1">
                                        <span class="material-symbols-outlined text-sm">delete</span>
                                        <span>Delete</span>
                                    </button>
                                </div>
                            </div>

                            <div class="pt-1">
                                ${starsHTML}
                            </div>

                            ${r.title ? `<h5 class="font-extrabold text-sm text-gray-900">${r.title}</h5>` : ''}
                            <p class="text-xs text-gray-700 leading-relaxed font-normal">${r.comment}</p>

                            <div class="pt-2 border-t border-gray-100 flex flex-wrap items-center justify-between gap-2 text-xs">
                                <span class="font-bold text-[#0077B6]">Product: ${productName}</span>
                                ${(r.images && Array.isArray(r.images) && r.images.length > 0) ? `
                                    <div class="flex gap-2">
                                        ${r.images.map(img => `<img src="${img}" class="w-12 h-12 object-cover rounded-lg border cursor-pointer" onclick="window.open('${img}', '_blank')"/>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Failed to load admin reviews:', err);
                container.innerHTML = `<div class="p-8 text-center text-red-500 text-xs font-bold">Failed to connect to reviews server.</div>`;
            }
        }

        async function deleteAdminReview(reviewId) {
            if (!confirm('Are you sure you want to delete this customer review permanently?')) return;
            try {
                const token = localStorage.getItem('om_admin_auth_token') || (window.getAuthToken ? await window.getAuthToken() : null);
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

                const res = await fetch(`http://localhost:3000/api/v1/admin/reviews/${reviewId}`, { method: 'DELETE', headers });
                const data = await res.json();
                if (res.ok && data.success) {
                    if (window.showToast) window.showToast('Review permanently deleted.', 'info');
                    loadAdminReviews();
                } else {
                    if (window.showToast) window.showToast(data.message || 'Failed to delete review.', 'error');
                }
            } catch (err) {
                console.error('Delete review failed:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadAdminReviews);
    </script>
</body>
</html>
